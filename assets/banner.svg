<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes floatText {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      .wave-path {
        stroke-dasharray: 10 14;
        animation: waveScroll 16s linear infinite;
      }
      .ambient-glow {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .live-dot {
        animation: dotBlink 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .brand-title {
        animation: floatText 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect width="898" height="258" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Matrix / Technical Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="260"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="420" y1="0" x2="420" y2="260"/>
    <line x1="540" y1="0" x2="540" y2="260"/>
    <line x1="660" y1="0" x2="660" y2="260"/>
    <line x1="780" y1="0" x2="780" y2="260"/>
    <line x1="0" y1="65" x2="900" y2="65"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="195" x2="900" y2="195"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="140" cy="110" r="90" fill="#0ea5e9" opacity="0.12" filter="url(#neonGlow)" class="ambient-glow"/>
  <circle cx="760" cy="140" r="110" fill="#8b5cf6" opacity="0.10" filter="url(#neonGlow)" class="ambient-glow"/>

  <!-- Sine / Frequency Wave Graphic -->
  <path class="wave-path" d="M 0,205 Q 120,180 240,205 T 480,205 T 720,205 T 900,205" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45"/>
  <path class="wave-path" d="M 0,215 Q 150,235 300,215 T 600,215 T 900,215" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.30"/>

  <!-- Status Chip Top Left -->
  <g transform="translate(48, 38)">
    <rect width="132" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle class="live-dot" cx="16" cy="13" r="4.5" fill="#10b981"/>
    <text x="28" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STABLE • v1.2</text>
  </g>

  <!-- Device Chip Top Right -->
  <g transform="translate(680, 38)">
    <rect width="172" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="86" y="17" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">REDMI NOTE 10 (SM6150)</text>
  </g>

  <!-- Main Typography -->
  <g class="brand-title" transform="translate(48, 126)">
    <text x="0" y="0" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="12" filter="url(#subtleGlow)">AETHER</text>
  </g>

  <text x="48" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="2">ANDROID KERNEL PROJECT FOR MOJITO &amp; SUNNY</text>

  <!-- Feature Tags Bottom Row -->
  <g transform="translate(48, 198)">
    <!-- Tag 1: MGLRU -->
    <g transform="translate(0, 0)">
      <rect width="88" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="44" y="17" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MGLRU</text>
    </g>

    <!-- Tag 2: KernelSU -->
    <g transform="translate(98, 0)">
      <rect width="138" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="69" y="17" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">KernelSU v3.3.1</text>
    </g>

    <!-- Tag 3: Display Nodes -->
    <g transform="translate(246, 0)">
      <rect width="156" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="78" y="17" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DC Dimming &amp; HBM</text>
    </g>

    <!-- Tag 4: Audio Calibration -->
    <g transform="translate(412, 0)">
      <rect width="130" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Calibrated Audio</text>
    </g>

    <!-- Tag 5: 300Hz -->
    <g transform="translate(552, 0)">
      <rect width="90" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="45" y="17" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">300Hz Tick</text>
    </g>

    <!-- Author Tag -->
    <g transform="translate(652, 0)">
      <rect width="152" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="76" y="17" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">@Kiran_Embedded</text>
    </g>
  </g>
</svg>
